# 첫 검증 범위는 C++ 클래스 기반 페이지다. GStreamer 자유 함수와 전체 캡처 흐름은 후속 단계다.
# per-package는 증분 갱신 시 기존 절 보존을 확인한 뒤 사용한다.
sections:
  - id: camera-model
    title: 카메라와 요청 모델
    output: camera-model.md
    kind: prose
    lead: CameraManager, Camera, Request의 선언과 메서드 위치부터 확인하세요.
    reader: libcamera의 공개 API를 분석하는 개발자
    answers:
      - 카메라 탐색과 요청 처리는 어떤 클래스에 나뉘어 있는가?
      - 정적으로 확인되지 않는 실행 경계는 어디인가?
    facts:
      classes: ["libcamera::CameraManager", "libcamera::Camera", "libcamera::Request"]
    watch: ["include/libcamera/**", "src/libcamera/camera*.cpp", "src/libcamera/request.cpp", "**/meson.build", "meson.options", "meson_options.txt"]
    next: {title: Pipeline Handler, link: pipeline-handler.md}

  - id: pipeline-handler
    title: Pipeline Handler
    output: pipeline-handler.md
    kind: prose
    lead: 공통 PipelineHandler와 빌드에 포함된 구현의 관계를 확인하세요.
    reader: 파이프라인 구현을 수정하는 개발자
    answers:
      - 공통 클래스와 하드웨어별 구현의 상속 관계는 무엇인가?
      - 설정과 요청 전달에서 직접 확인할 수 있는 메서드는 무엇인가?
    facts:
      classes: ["libcamera::PipelineHandler", "libcamera::PipelineHandler*"]
    watch: ["src/libcamera/pipeline/**", "src/libcamera/pipeline_handler.cpp", "include/libcamera/internal/pipeline_handler.h", "**/meson.build", "meson.options", "meson_options.txt"]
    next: {title: IPA 관련 클래스, link: ipa.md}

  - id: ipa
    title: IPA 관리와 구현 진입점
    output: ipa.md
    kind: prose
    lead: IPA 관리자, 모듈, 프록시와 IPU3·RKISP1 구현의 근거 위치를 먼저 확인하세요.
    reader: 영상 처리 알고리즘과 프로세스 경계를 분석하는 개발자
    answers:
      - 사실에 포함된 IPA 관련 클래스는 무엇인가?
      - 프록시와 알고리즘 사이에서 추가 확인이 필요한 경계는 무엇인가?
    facts:
      classes: ["libcamera::IPAManager", "libcamera::IPAModule", "libcamera::IPAProxy", "libcamera::ipa::ipu3::IPAIPU3", "libcamera::ipa::rkisp1::IPARkISP1"]
    watch: ["src/ipa/**", "src/libcamera/ipa*", "src/libcamera/proxy/**", "include/libcamera/ipa/**", "include/libcamera/internal/ipa*", "**/meson.build", "meson.options", "meson_options.txt"]
    next: {title: 카메라와 요청 모델, link: camera-model.md}
