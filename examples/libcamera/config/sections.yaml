sections:
- id: overview
  title: 시스템 개요
  output: overview.md
  kind: prose
  lead: 수정할 코드가 어느 패키지에 있는지 아래 표에서 먼저 찾으세요.
  reader: libcamera 코드를 처음 읽는 개발자
  answers:
  - 소스는 어떤 패키지로 나뉘고, 각 패키지에는 어떤 클래스가 들어 있는가?
  - 패키지 사이의 상속과 필드 참조는 어느 방향으로 향하는가?
  - 애플리케이션이 요청을 제출하면 호출은 어떤 순서로 코드를 지나가는가?
  facts:
    # 패키지 이름은 sdd.yaml 의 facts.package_depth 로 결정된다 (이 예제는 3).
    # include/linux 의 커널 UAPI 정의와 build/ 아래 생성 헤더는 표에서 뺀다.
    packages:
    - src/*
    - include/libcamera*
    # 인용할 file:line 을 주려고 사실로만 넘긴다. 클래스 표는 camera-model.md 가 담당한다.
    classes:
    - libcamera::CameraManager
    - libcamera::Camera
    - libcamera::Request
    - libcamera::PipelineHandler
    - libcamera::IPAManager
    class_table: false
    # 클래스 변경으로는 개요를 다시 만들지 않는다. watch 만 본다.
    impact_classes: []
    reading_order: queue_request
  routes:
  - q: 수정할 패키지를 찾습니다.
    to: '#패키지별-역할'
  - q: 패키지 사이의 의존 방향을 확인합니다.
    to: '#패키지-사이의-의존'
  - q: 요청이 처리되는 순서를 처음 봅니다.
    to: '#코드를-처음-읽는-순서'
  - q: 클래스 단위 책임을 확인합니다.
    to: camera-model.md
  watch:
  - src/**
  - include/libcamera/**
  - '**/meson.build'
  - meson.options
  - meson_options.txt
  next:
    title: 핵심 시나리오 시퀀스
    link: scenarios/index.md
- id: scenarios
  title: 핵심 시나리오 시퀀스
  output: scenarios/index.md
  kind: per-scenario
  lead: 추적하려는 동작을 표에서 고르세요. 각 시나리오는 진입 함수부터 호출 순서를 번호로 보여 줍니다.
  reader: 특정 동작의 호출 경로를 추적하는 개발자
  answers:
  - 호출은 어떤 순서로 어느 컴포넌트를 지나가는가?
  - 어디서 분기하고, 어디서 정적 추적이 끊기는가?
  facts:
    scenarios: '*'
  watch:
  - src/libcamera/**
  - src/ipa/**
  next:
    title: 카메라와 요청 모델
    link: camera-model.md
- id: camera-model
  title: 카메라와 요청 모델
  output: camera-model.md
  kind: prose
  lead: 클래스의 책임, 요청과 버퍼의 수명, 상태 전이와 종료·동기화 계약을 코드 근거로 확인하세요.
  reader: libcamera의 공개 API를 분석하는 개발자
  answers:
  - 카메라 탐색과 요청 처리는 어떤 클래스에 나뉘어 있는가?
  - 정적으로 확인되지 않는 실행 경계는 어디인가?
  facts:
    classes:
    - libcamera::CameraManager
    - libcamera::Camera
    - libcamera::Request
  watch:
  - include/libcamera/**
  - src/libcamera/camera*.cpp
  - src/libcamera/request.cpp
  - '**/meson.build'
  - meson.options
  - meson_options.txt
  next:
    title: Pipeline Handler
    link: pipeline-handler.md
  semantic_review: true
  design_topics:
  - id: responsibility
    title: 클래스별 책임
    question: CameraManager, Camera, Request의 책임과 객체 수명은 어떻게 나뉩니까?
    sources:
    - id: manager
      file: src/libcamera/camera_manager.cpp
      start: \class CameraManager
      end: CameraManager *CameraManager::self_
      sha256: adcd6d49b0c989ec78a81cacece7f6c871a8e0ddf3aa52e42648fae2760a6e84
    - id: camera
      file: src/libcamera/camera.cpp
      start: The Camera class models a camera
      end: \section camera_operation
      sha256: e77cee469b7c57430e4bd4b0f08493289c46b57549873521c476df388d591dc2
    - id: request
      file: src/libcamera/request.cpp
      start: '\class Request

        '
      end: Request::Request(Camera *camera, uint64_t cookie)
      sha256: 948968e35cb0d98957bc63aa2d6b613d2a8203e66855db23974f035e9d679764
    statements:
    - text: CameraManager는 장치를 열거하고 파이프라인과 연결하여 애플리케이션에 카메라를 제공합니다. 동시에 한 인스턴스만 존재해야 하며, 카메라 참조를 모두 해제한 뒤 관리자를 정지해야
        합니다.
      evidence:
      - manager
    - text: Camera는 단일 이미지 소스의 스트림 구성과 캡처를 제어합니다. create()가 반환하는 shared_ptr로 수명을 관리하며 생성자와 소멸자는 비공개입니다.
      evidence:
      - camera
    - text: Request는 프레임별 버퍼와 컨트롤을 묶는 캡처 요청입니다. cookie는 완료 처리에서 외부 자원과 요청을 연결할 수 있도록 애플리케이션이 지정하는 값입니다.
      evidence:
      - request
  - id: state
    title: 상태와 허용 호출
    question: 상태 전이와 허용 호출을 설명하고, 상태를 바꾸는 함수의 동기화 책임을 구분하세요.
    sources:
    - id: states
      file: src/libcamera/camera.cpp
      start: \section camera_operation
      end: \enddot
      sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
    - &id004
      id: start
      file: src/libcamera/camera.cpp
      start: \brief Start capture from camera
      end: int Camera::start(const ControlList *controls)
      sha256: e0abda64dc6b1bdd78d1326c8dd8651e842c03181dcf28e3b8b7eac1a4c70fcf
    statements:
    - text: 일반적인 순서는 Available → acquire() → Acquired → configure() → Configured → start() → Running입니다. Configured에서는
        재구성과 요청 생성이 가능하고, Running에서는 요청 생성과 큐잉이 가능합니다.
      evidence:
      - states
    - text: Running에서 stop()을 호출하면 Stopping을 거쳐 Configured로 돌아갑니다. Acquired 또는 Configured에서 release()를 호출하면 Available로
        돌아갑니다. 이 상태도에 없는 호출까지 금지된 것으로 해석하지 않습니다.
      evidence:
      - states
    - text: start()는 Configured에서만 호출하며, 호출자가 다른 상태 변경 함수와 동기화해야 합니다. 상태 변경 함수 전반의 동기화를 Camera가 대신 보장하지 않습니다.
      evidence:
      - states
      - start
  - id: request
    title: 요청 생성과 완료
    question: 요청 생성, 버퍼 연결, 큐잉, 완료 통지의 순서와 제출 조건을 설명하세요.
    sources:
    - &id001
      id: create
      file: src/libcamera/camera.cpp
      start: \brief Create a request object for the camera
      end: std::unique_ptr<Request> Camera::createRequest(uint64_t cookie)
      sha256: 9f251ecf5ba569606e9753d3619b88e1aef5a4ce15f816ae97efd283e34b823b
    - &id003
      id: queue
      file: src/libcamera/camera.cpp
      start: \brief Queue a request to the camera
      end: int Camera::queueRequest(Request *request)
      sha256: cfb159c13e38b6bedaf5d706c2a4e076b62185a9cf378755e4c1485ebe559f94
    - &id002
      id: buffer
      file: src/libcamera/request.cpp
      start: \brief Add a FrameBuffer with its associated Stream to the Request
      end: int Request::addBuffer(const Stream *stream, FrameBuffer *buffer,
      sha256: 65cd8b0501b7f6545dd10eaaec4a4fe46c52a096a3bbd94ea6b4813e4a670876
    statements:
    - text: Configured 또는 Running 상태에서 createRequest()로 빈 요청을 만들고 addBuffer()로 스트림과 버퍼를 연결합니다. 요청에는 최소 하나의 캡처 버퍼가
        있어야 합니다.
      evidence:
      - create
      - queue
      - buffer
    - text: Running 상태에서 queueRequest()를 호출하여 제출합니다. 완료 시 requestCompleted 신호를 받으며, 요청 소유자인 호출자는 완료 핸들러에서 삭제하거나
        reuse()로 초기화한 뒤 다시 사용할 수 있습니다.
      evidence:
      - queue
      - create
    - text: 유효한 fence를 addBuffer()에 전달하면 성공한 경우에만 fence가 버퍼로 이동합니다. 모든 버퍼의 fence가 신호를 보내야 장치에 요청을 큐잉할 수 있습니다.
      evidence:
      - buffer
  - id: lifetime
    title: 소유권과 재사용
    question: 요청 소유권과 완료 뒤 재사용, ReuseBuffers, fence 이전 조건을 설명하세요. 근거에 없는 버퍼 소유권은 추정하지 마세요.
    sources:
    - *id001
    - id: reuse
      file: src/libcamera/request.cpp
      start: \brief Reset the request for reuse
      end: \fn Request::controls()
      sha256: 22294a6809bd4c6655824af9603fb3879603cec256c6845e00d3d2a0e6bf7679
    - *id002
    statements:
    - text: createRequest()가 반환한 요청의 소유권은 호출자에게 있습니다. 요청을 완료 핸들러에서 삭제하거나 Request::reuse()로 초기화하여 재사용합니다. 이 근거만으로
        프레임 버퍼 자체의 소유권 이전을 단정하지 않습니다.
      evidence:
      - create
    - text: reuse()는 요청 상태와 컨트롤·메타데이터를 초기화합니다. ReuseBuffers를 지정하면 기존 버퍼 연결을 재사용하고, 지정하지 않으면 버퍼 맵을 비웁니다. 새 요청 대신
        재사용하는 경우 재큐잉 전에 호출합니다.
      evidence:
      - reuse
    - text: fence의 소유권은 addBuffer() 성공 시 버퍼로 이동합니다. 신호를 받지 못해 타임아웃된 fence는 버퍼에 남으므로, 다른 요청에 버퍼를 재사용하기 전에 releaseFence()로
        꺼내야 합니다. 실패한 addBuffer() 호출은 전달된 fence를 변경하지 않습니다.
      evidence:
      - buffer
  - id: shutdown
    title: 오류와 종료
    question: queueRequest의 오류 조건과 stop의 취소·완료·복귀 상태를 설명하세요.
    sources:
    - *id003
    - &id005
      id: stop
      file: src/libcamera/camera.cpp
      start: \brief Stop capture from camera
      end: \brief Handle request completion and notify application
      sha256: 0009c665993b995489738e48affc81643a7159d82b5326e5f182e30fe11e4901
    statements:
    - text: queueRequest()는 연결이 끊긴 카메라에 -ENODEV, 실행 중이 아닌 카메라에 -EACCES, 다른 카메라의 요청에 -EXDEV를 반환합니다. 유효하지 않은 요청에는
        -EINVAL, 처리할 버퍼 메모리가 부족하면 -ENOMEM을 반환한다고 API가 명시합니다. 빈 버퍼 요청은 큐잉하지 않습니다.
      evidence:
      - queue
    - text: stop()은 대기 중인 요청을 오류 상태로 취소하여 동기적으로 완료합니다. 구현은 실행 중이 아니면 즉시 0을 반환하므로, 이 경로가 -EACCES를 반환한다고 해석하면 안 됩니다.
      evidence:
      - stop
    - text: 실행 중인 카메라는 CameraStopping으로 전환한 뒤 ConnectionTypeBlocking으로 PipelineHandler::stop을 호출합니다. 대기 요청이 없음을
        확인하고 CameraConfigured로 돌아갑니다. 하드웨어별 자원 해제 완료는 별도의 실행 검증이 필요합니다.
      evidence:
      - stop
  - id: concurrency
    title: 동시성과 실행 확인
    question: threadsafe로 명시된 호출과 호출자가 동기화해야 하는 호출을 구분하세요. 콜백 실행 스레드와 하드웨어 종료 검증은 미확인으로 남기세요.
    sources:
    - *id001
    - *id003
    - *id004
    - *id005
    statements:
    - text: createRequest()와 queueRequest()는 API 주석에 threadsafe로 명시되어 있습니다. 허용 상태는 각각 Configured 또는 Running과 Running이며,
        이 보장을 모든 Request 메서드로 확대하지 않습니다.
      evidence:
      - create
      - queue
    - text: start()와 stop()을 다른 상태 변경 함수와 동기화하는 책임은 호출자에게 있습니다. stop() 내부의 파이프라인 호출은 ConnectionTypeBlocking이며 비동기
        호출로 설명하면 안 됩니다.
      evidence:
      - start
      - stop
    - text: '확인 필요: 이 발췌만으로 requestCompleted 콜백의 실제 실행 스레드, 재진입 가능성, 하드웨어별 종료 시점은 확정하지 않습니다. 해당 연결 방식과 파이프라인 구현을
        추가로 검토하고 실행으로 확인해야 합니다.'
      evidence:
      - queue
      - stop
- id: pipeline-handler
  title: Pipeline Handler
  output: pipeline-handler.md
  kind: prose
  lead: 공통 PipelineHandler와 빌드에 포함된 구현의 관계를 확인하세요.
  reader: 파이프라인 구현을 수정하는 개발자
  answers:
  - 공통 클래스와 하드웨어별 구현의 상속 관계는 무엇인가?
  - 설정과 요청 전달에서 직접 확인할 수 있는 메서드는 무엇인가?
  facts:
    classes:
    - libcamera::PipelineHandler
    - libcamera::PipelineHandler*
  watch:
  - src/libcamera/pipeline/**
  - src/libcamera/pipeline_handler.cpp
  - include/libcamera/internal/pipeline_handler.h
  - '**/meson.build'
  - meson.options
  - meson_options.txt
  next:
    title: IPA 관련 클래스
    link: ipa.md
  semantic_review: true
- id: ipa
  title: IPA 관리와 구현 진입점
  output: ipa.md
