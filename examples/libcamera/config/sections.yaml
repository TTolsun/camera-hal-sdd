  lead: IPA 관리자, 모듈, 프록시와 IPU3·RKISP1 구현의 근거 위치를 먼저 확인하세요.
  reader: 영상 처리 알고리즘과 프로세스 경계를 분석하는 개발자
  answers:
  - 사실에 포함된 IPA 관련 클래스는 무엇인가?
  - 프록시와 알고리즘 사이에서 추가 확인이 필요한 경계는 무엇인가?
  facts:
    classes:
    - libcamera::IPAManager
    - libcamera::IPAModule
    - libcamera::IPAProxy
    - libcamera::ipa::ipu3::IPAIPU3
    - libcamera::ipa::rkisp1::IPARkISP1
  watch:
  - src/ipa/**
  - src/libcamera/ipa*
  - src/libcamera/proxy/**
  - include/libcamera/ipa/**
  - include/libcamera/internal/ipa*
  - '**/meson.build'
  - meson.options
  - meson_options.txt
  next:
    title: IPU3 LSC와 상태 연결
    link: ipu3-lsc.md
  semantic_review: true
- id: ipu3-lsc
  title: IPU3 LSC와 상태 연결
  output: ipu3-lsc.md
  kind: prose
  lead: 현재 커밋의 LSC 구현과 IPU3 상태 연결을 확인하세요.
  reader: IPU3 변경을 검토하는 개발자
  semantic_review: true
  answers:
  - Lsc가 현재 facts에 존재합니까? 없으면 구현이 있다고 서술하지 마세요.
  - 직접 상속과 필드 참조를 구분하고 IPU3 상태의 LSC 연결을 설명하세요.
  - LSC 자유 함수의 역할은 추출된 근거 범위에서만 설명하세요.
  facts:
    classes:
    - libcamera::ipa::ipu3::algorithms::Lsc
    - libcamera::ipa::ipu3::IPAActiveState
    - libcamera::ipa::ipu3::IPAFrameContext
    - libcamera::ipa::lsc::ActiveState
    - libcamera::ipa::lsc::FrameContext
    - libcamera::ipa::LscAlgorithm
    - libcamera::ipa::ipu3::IPAContext
    - libcamera::ipa::ipu3::IPASessionConfiguration
    functions:
    - libcamera::ipa::ipu3::algorithms::quantize
    - libcamera::ipa::ipu3::algorithms::logCategoryIPU3Lsc
  watch:
  - src/ipa/ipu3/**
  - src/ipa/libipa/lsc*
  next:
    title: IPU3 LSC의 설정과 프레임 처리
    link: ipu3-lsc-flow.md
  narration: facts
