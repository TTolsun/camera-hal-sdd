    link: overview.md
  design_topics:
  - id: integration
    title: 빌드와 상태 연결
    question: LSC 구현 파일과 공유 상태 및 프레임별 상태는 어떻게 연결됩니까?
    sources:
    - id: build
      file: src/ipa/ipu3/algorithms/meson.build
      start: ipu3_ipa_algorithms = files([
      end: '])'
      sha256: 5b34e175668b4fedb33a633567f049c2738f6368c3b4d8ac26d069e77add82c9
    - id: context
      file: src/ipa/ipu3/ipa_context.h
      start: struct IPASessionConfiguration {
      end: '} /* namespace ipa::ipu3 */'
      sha256: e373aff7c5b5e5f034637b3d9030b0fdef974614261025791afd6e3146b1108d
    statements:
    - text: IPU3 알고리즘 빌드 목록에는 lsc.cpp가 포함됩니다. 이 목록에 있다는 사실만으로 실행 중인 카메라에서 LSC가 활성화됐다고 판단할 수는 없습니다.
      evidence:
      - build
    - text: IPAContext는 공유 activeState와 프레임 컨텍스트 큐를 보유합니다. IPAActiveState의 lsc 필드와 IPAFrameContext의 lsc 필드가 각각 공유
        상태와 프레임별 상태를 연결합니다.
      evidence:
      - context
  - id: setup
    title: 초기화와 크롭 설정
    question: 센서 크기에서 그리드를 만들고 크롭 설정을 전달하는 과정을 설명하세요.
    sources:
    - id: setup
      file: src/ipa/ipu3/algorithms/lsc.cpp
      start: static constexpr unsigned int kMaxNumHCells
      end: void Lsc::queueRequest(
      sha256: 943557ac46750b8b53d8280921b313e4331e786e8ff88766abb0fe02959d2f63
    statements:
    - text: init()는 센서 activeAreaSize를 기준으로 그리드를 계산합니다. 가로 73개와 세로 56개라는 셀 수 상한에 맞춰 필요한 셀 크기를 계산하고, 이를 2의 거듭제곱으로
        올림한 뒤 실제 셀 수와 블록 크기를 정합니다.
      evidence:
      - setup
    - text: 튜닝 데이터의 type이 polynomial인지 저장한 뒤, r·gr·gb·b 성분과 샘플 수 및 센서 크기를 공통 LSC 알고리즘의 init()에 전달합니다. 반환값은 호출자에게
        그대로 반환합니다.
      evidence:
      - setup
    - text: configure()는 analogCrop의 너비와 높이를 저장합니다. 각 축의 샘플 위치를 0부터 1까지 생성하고, 크롭 영역 및 공유 LSC 상태와 함께 공통 알고리즘의 configure()에
        전달합니다. 이 코드는 샘플 수가 1일 때의 나눗셈을 별도로 처리하지 않으므로 지원 센서 크기의 경계 조건은 추가 검증이 필요합니다.
      evidence:
      - setup
  - id: request
    title: 첫 프레임과 요청별 제어
    question: 첫 프레임의 기본 활성화 처리와 공통 알고리즘으로 넘기는 데이터를 설명하세요.
    sources:
    - id: request
      file: src/ipa/ipu3/algorithms/lsc.cpp
      start: void Lsc::queueRequest(
      end: static unsigned int quantize(
      sha256: 550c83f35d2a4d5218ac10731fe8650d8446e262841f2dd80a54e9238c7da287
    statements:
    - text: frame이 0이고 요청에 LensShadingCorrectionEnable 제어가 없으면 프레임의 enabled와 update를 true로 설정합니다. 소스 주석은 공통 알고리즘이
        알리는 기본값과 IPU3 드라이버의 기본 비활성 상태를 맞추기 위한 처리라고 설명합니다.
      evidence:
      - request
    - text: 이후 공유 LSC 상태, 현재 프레임의 LSC 상태와 요청 controls를 공통 알고리즘의 queueRequest()에 전달합니다. 여기서 설명하는 것은 IPU3 래퍼의 전달 동작이며,
        모든 제어 값의 처리 규칙이나 콜백 실행 스레드까지 확인한 것은 아닙니다.
      evidence:
      - request
  - id: prepare
    title: 파라미터 갱신 조건
    question: 색온도 변경에 따른 생략 조건과 커널에 전달하는 파라미터를 설명하세요.
    sources:
    - id: prepare
      file: src/ipa/ipu3/algorithms/lsc.cpp
      start: static unsigned int quantize(
      end: void Lsc::process(
      sha256: 1d11fc7397b377f682d4fab45d12dd20480e554176aae94ba2708a5f8f747268
    - id: constants
      file: src/ipa/ipu3/algorithms/lsc.cpp
      start: static constexpr unsigned int kMaxNumHCells
      end: int Lsc::init(
      sha256: 7807718b4ae9327f1ca428627d2b00f59ba38ced03261465ee8c79312ea27833
    statements:
    - text: prepare()는 현재 프레임 AWB의 색온도를 읽어 10 단위로 반올림합니다. update가 false일 때만 다음 생략 조건을 검사합니다. 비활성 상태이면 바로
        반환하고, 활성 상태에서도 직전 적용 색온도와의 차이가 5 미만이거나 양자화된 값이 같으면 갱신을 생략합니다. update가 true이면 이 생략 조건들을 적용하지 않습니다.
      evidence:
      - prepare
      - constants
    - text: 갱신 경로에서는 use.acc_shd를 1로 설정하고 shd_enable에 현재 활성 상태를 기록합니다. update가 true이고 enabled가 false인 경우에도
        이 플래그를 기록한 뒤 반환하므로, 단순히 비활성 상태의 모든 호출을 생략하는 것은 아닙니다.
      evidence:
      - prepare
    - text: 활성 상태에서는 그리드와 크롭 오프셋을 설정하고, 양자화한 색온도로 interpolateComponents()를 호출합니다. 반환된 r·gr·gb·b 배열을 LUT에 복사한 뒤 마지막으로
        적용한 색온도 두 값을 저장합니다. 실제 하드웨어의 적용 시점과 LUT 분할 경계의 적합성은 기기에서 별도로 검증해야 합니다.
      evidence:
      - prepare
  - id: metadata
    title: 메타데이터와 확인 범위
    question: 프레임 처리 결과를 전달하는 경계와 미검증 사항을 설명하세요.
    sources:
    - id: process
      file: src/ipa/ipu3/algorithms/lsc.cpp
      start: void Lsc::process(
      end: REGISTER_IPA_ALGORITHM(Lsc, "Lsc")
      sha256: e1411dc6710e62f774ea84588792a3f6fd547beb3442bc7cc49495eb19dff05e
    statements:
    - text: IPU3의 process()는 프레임 LSC 상태와 출력 metadata를 공통 알고리즘의 process()에 전달합니다. 이 래퍼는 전달받은 통계를 직접 읽지 않습니다. 파일 끝에서는
        Lsc라는 이름으로 알고리즘을 등록합니다.
      evidence:
      - process
    - text: 이 문서는 고정된 libcamera 커밋의 구현을 설명합니다. 센서별 화질, 실행 스레드, 실제 프레임의 파라미터 적용 시점과 사내 Camera HAL 동작을 검증한 결과는 아닙니다.
      evidence:
      - process
