# clang-uml 정적 다이어그램 설정.
# compilation_database_dir 과 output_directory 는 파이프라인이 실행 시점에 sdd.yaml 값으로 덮어쓴다.
# sequence 다이어그램은 config/scenarios.yaml 에서 자동 생성되어 여기에 병합된다 (build/clang-uml.yaml 참조).
#
# NDK cross-compile 관련:
#   compile_commands.json 의 --target / --sysroot 이 NDK 경로를 가리키므로 그 NDK 가 같은 머신에 설치되어 있어야 한다.
#   표준 헤더를 못 찾으면 remove_compile_flags 로 문제 플래그를 빼고 add_compile_flags 로 include 경로를 보탠다.

compilation_database_dir: ../hal-camera
output_directory: build/diagrams

# 예: NDK 경로가 다른 머신에서 만든 compile DB 를 쓸 때
# remove_compile_flags:
#   - "--sysroot=/old/ndk/sysroot"
# add_compile_flags:
#   - "--sysroot=/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

generate_links: false
generate_metadata: true

diagrams:
  class_overview:
    type: class
    glob:
      - "**/*.cpp"
      - "**/*.cc"
      - "**/*.h"
      - "**/*.hpp"
    # 외부 헤더(NDK, libc++)는 제외한다. 필요하면 실제 네임스페이스로 좁힌다.
    exclude:
      paths:
        - "**/toolchains/**"
        - "**/sysroot/**"
        - "**/test/**"
        - "**/tests/**"
    generate_method_arguments: none
    generate_packages: true
    package_type: directory
    include_relations_also_as_members: false

  packages:
    type: package
    glob:
      - "**/*.cpp"
      - "**/*.cc"
    package_type: directory
    exclude:
      paths:
        - "**/toolchains/**"
        - "**/sysroot/**"

  includes:
    type: include
    glob:
      - "**/*.cpp"
      - "**/*.cc"
    relative_to: ../hal-camera
    generate_system_headers: false
